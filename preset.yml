schema_version: "1.0"

# Appends to two core skills rather than replacing them, so upstream changes to
# the rest of each skill keep arriving. The fragments carry no frontmatter: a
# description there replaces the skill's own, which is what Claude reads to
# decide when to invoke it. tests/compose.sh checks all of this against the
# real CLI.
preset:
  id: "test-first"
  name: "Test-first"
  version: "1.3.0"
  description: "Makes test tasks required in /speckit-tasks, and red-green-refactor verifiable and independently reviewed in /speckit-implement"
  author: "camilopiedra92"
  repository: "https://github.com/camilopiedra92/spec-kit-preset-test-first"
  license: "MIT"

requires:
  speckit_version: ">=1.1.0"

provides:
  templates:
    - type: "command"
      name: "speckit.tasks"
      file: "commands/speckit.tasks.md"
      description: "Test tasks are required, one cycle per behaviour, never parallel, ordered simplest first, requirement IDs cited"
      strategy: "append"

    - type: "command"
      name: "speckit.implement"
      file: "commands/speckit.implement.md"
      description: "One red-green-refactor cycle at a time; new cases join the task list; a task closes on a green suite and the project's static checks against a baseline; tool config stays the project's; each story ends with an independent review of tests and structure"
      strategy: "append"

tags:
  - "tdd"
  - "test-first"
  - "testing"
